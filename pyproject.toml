[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beliefspec-pilot"
version = "0.1.0"
description = "Controlled predictive-memory pilot on MiniGrid Memory"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "torch", "minigrid", "matplotlib", "pytest", "reportlab", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

